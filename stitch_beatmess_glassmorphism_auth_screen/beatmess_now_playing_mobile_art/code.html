<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined">expand_more</span>
</button>
<div class="text-center">
<p class="font-label-caps text-label-caps text-primary uppercase tracking-widest">Now Playing</p>
<p class="font-body-sm text-body-sm text-on-surface-variant mt-1">From Playlist: Synthwave Essentials</p>
</div>
<button class="w-10 h-10 rounded-full glass-panel flex items-center justify-center text-on-surface hover:text-primary transition-colors">
<span class="material-symbols-outlined">more_vert</span>
</button>
</div>
<!-- Album Art -->

<div class="relative w-[280px] h-[280px] rounded-[24px] glass-panel p-2 art-glow group transition-transform duration-500 hover:scale-105">

</div>

<span class="material-symbols-outlined text-3xl group-hover:scale-110 transition-transform" style="font-variation-settings: 'FILL' 1;">favorite</span>
</button>
</div>
<!-- Progress Bar -->
<div class="mb-8 px-2">
<div class="h-1.5 w-full bg-white/10 rounded-full overflow-hidden mb-2 relative cursor-pointer">
<div class="h-full bg-gradient-to-r from-primary to-secondary w-2/3 absolute top-0 left-0"></div>
</div>
<div class="flex justify-between font-body-sm text-body-sm text-on-surface-variant/70">
<span>2:45</span>
<span>-1:15</span>
</div>

</button>

</button>
